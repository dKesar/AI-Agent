name: Workshop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m scripts.check_environment
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.run_cases
      - run: python -m scripts.check_exercise --solution
      - run: python -m scripts.check_links
      - run: python -m scripts.beginner --demo
  browser-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m scripts.check_browser_parity
      - run: node scripts/build_browser_site.mjs
      - run: git diff --exit-code -- site/app.js
      - run: python -m scripts.package_browser_site
      - run: python -m scripts.check_browser_package
